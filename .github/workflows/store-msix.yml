name: Microsoft Store MSIX
on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Package identity name from Partner Center
        required: true
        type: string
        default: Darrit.UriNamu
      publisher:
        description: Publisher from Partner Center (including CN=)
        required: true
        type: string
        default: CN=7A7791F0-9BBF-47FD-AA66-31DE180F2FA1
      publisher_display_name:
        description: Publisher display name from Partner Center
        required: true
        type: string
        default: Darrit
permissions:
  contents: read
jobs:
  msix:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - name: Pinned Rust toolchain
        run: python scripts/install-ci-rust.py
      - name: Pinned npm
        run: npm install --global npm@12.2.1 --before=2026-10-18T04:52:05Z
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib
      - name: Build MSIX for Store submission
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
        run: ./scripts/Build-MSIX.ps1 -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UriNamu-store-msix
          path: src-tauri/target/release/bundle/msix/*.msix
          if-no-files-found: error
