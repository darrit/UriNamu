name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            args: --bundles nsis
          - os: macos-14
            name: macos-universal
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-22.04
            name: linux-x64
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - name: Release tag matches the application version
        if: github.ref_type == 'tag'
        run: node scripts/release-tag.mjs
      - name: Linux build libraries (dated repository)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/urinamu-apt/lists/partial
          echo 'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20261016T000000Z jammy main universe' > /tmp/urinamu-apt/snapshot.list
          echo 'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20261016T000000Z jammy-updates main universe' >> /tmp/urinamu-apt/snapshot.list
          sudo apt-get -o Dir::Etc::sourcelist=/tmp/urinamu-apt/snapshot.list -o Dir::Etc::sourceparts=- -o Dir::State::lists=/tmp/urinamu-apt/lists update
          sudo apt-get -o Dir::Etc::sourcelist=/tmp/urinamu-apt/snapshot.list -o Dir::Etc::sourceparts=- -o Dir::State::lists=/tmp/urinamu-apt/lists install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Pinned Rust toolchain
        run: python scripts/install-ci-rust.py
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add --toolchain 1.99.1 aarch64-apple-darwin x86_64-apple-darwin
      - name: Pinned npm
        run: npm install --global npm@12.2.1 --before=2026-10-18T04:52:05Z
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib
      - run: npm run desktop:build -- ${{ matrix.args }} -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UriNamu-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
  publish:
    name: GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node scripts/release-tag.mjs --notes > release-notes.md
          mkdir -p dist release
          gh run download "$GITHUB_RUN_ID" --dir dist
          node scripts/release-tag.mjs --collect dist release
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "UriNamu ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag release/*
          fi
