[package]
name = "urinamu"
version = "0.6.2"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.99"

[lib]
name = "urinamu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "=2.7.3", optional = true , features = [] }

[dependencies]
tauri = { version = "=2.12.4", optional = true , features = [] }
tauri-plugin-dialog = { version = "=2.8.3", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
pbkdf2 = "=0.13.0"
sha2 = "=0.11.1"
base64 = "=0.23.1"
getrandom = "=0.4.3"
zeroize = "=1.9.1"

# BEGIN GENERATED RELEASE-AGE CONSTRAINTS
# Latest mature versions required by the locked dependency graph; no runtime dependencies.
